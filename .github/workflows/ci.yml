name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      USE_MOCK_RAG: "true"
      EMAIL_MODE: file
      DB_PATH: data/app.db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint (ruff check)
        run: python -m ruff check src/ app/ tests/ evals/ scripts/
      - name: Format check (ruff format)
        run: python -m ruff format --check src/ app/ tests/ evals/ scripts/
      - name: Run tests
        run: python -m pytest tests/ -v
